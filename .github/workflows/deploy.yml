name: Build, Publish, and Deploy Website

on:
  push:
    branches:
      - qa
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile app/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/bryanf23/self-hosted-site-is373:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to QA or Production
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_ENV: ${{ github.ref_name }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,DEPLOY_ENV,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /home/bryan/self-hosted-site

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

            export IMAGE_TAG

            if [ "$DEPLOY_ENV" = "qa" ]; then
              docker compose pull qa-web
              docker logout ghcr.io
              docker compose up -d --no-deps qa-web
            elif [ "$DEPLOY_ENV" = "main" ]; then
              docker compose pull web
              docker logout ghcr.io
              docker compose up -d --no-deps web
            else
              echo "Unsupported deployment branch: $DEPLOY_ENV"
              docker logout ghcr.io
              exit 1
            fi
